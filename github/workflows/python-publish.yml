name: Publish to PyPI

# Release:  1. bump __version__ in src/Lab_nas/__init__.py, commit, push
#           2. GitHub -> Releases -> "Draft a new release" -> new tag v0.2.2 -> Publish
# A published release uploads to PyPI. Pushes to main and pull requests only build + test.
on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Release tag must match __version__
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('src/Lab_nas/__init__.py').read()).group(1))")
          echo "release tag: $TAG   __version__: $VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match __version__ = '$VERSION' in src/Lab_nas/__init__.py"
            exit 1
          fi

      - name: Build release distributions
        run: |
          rm -rf dist            # never upload old files that were committed to dist/
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: release-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Commands are on PATH and work
        shell: bash
        run: |
          set -e
          lab_nas --version
          lab-nas --version
          python -m Lab_nas --version
          lab_nas path
          lab_nas info
          lab_nas --help > /dev/null
          lab_nas session || true          # "Not logged in" is the expected answer
          python -c "import Lab_nas; print('import OK', Lab_nas.__version__)"

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [release-build, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # mandatory for PyPI Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/Lab_nas
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
