name: Publish to PyPI

# Release:  bump __version__ in src/Lab_nas/__init__.py, commit, then
#           git tag v0.2.2 && git push origin v0.2.2
# A tag publishes to PyPI. Pushes to main and pull requests only build + test.
# "Run workflow" on the Actions tab does the same build + test by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Tag must match __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('src/Lab_nas/__init__.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag: $TAG   __version__: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match __version__ = '$VERSION' in src/Lab_nas/__init__.py"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          rm -rf dist            # never upload old files that were committed to dist/
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Commands are on PATH and work
        shell: bash
        run: |
          set -e
          lab_nas --version
          lab-nas --version
          python -m Lab_nas --version
          lab_nas path
          lab_nas --help > /dev/null
          lab_nas session || true          # "Not logged in" is the expected answer
          python -c "import Lab_nas; print('import OK', Lab_nas.__version__)"

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC): no password or API token stored in GitHub.
    environment:
      name: pypi
      url: https://pypi.org/p/Lab_nas
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
